name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: test
        run: pnpm test

      - name: coverage gate (packages/ledger-core, 100% branch)
        run: pnpm coverage

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: audit (fails on any high or critical vulnerability)
        run: pnpm run audit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: install Playwright's browser
        run: pnpm --filter @arka/e2e exec playwright install --with-deps chromium

      - name: local env
        run: cp .env.example .env

      - name: start Cell and control-plane infrastructure
        run: docker compose up -d

      - name: wait for every database to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' arka-cell1-postgres)" = "healthy" ] && \
               [ "$(docker inspect -f '{{.State.Health.Status}}' arka-cell2-postgres)" = "healthy" ] && \
               [ "$(docker inspect -f '{{.State.Health.Status}}' arka-control-plane-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "containers did not become healthy in time" >&2
          exit 1

      - name: end-to-end tests, both critical journeys
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
<<<<<<< Updated upstream
      checks: write
=======
>>>>>>> Stashed changes
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
