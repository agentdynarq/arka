# Synthetic availability check against the live deployment.
#
# The Recovery Console tells an operator what the platform thinks of itself.
# This asks the question from outside, on a schedule, from a machine that is
# not ours: can a customer actually reach their Cell, is the certificate
# valid, and is anything exposed that should not be. Nobody has to be watching
# for this to fire, which is the whole point of the difference between a
# dashboard and monitoring.
#
# A failure opens a GitHub issue rather than sending mail, so the alert lands
# in the same place as the work and carries its own history.
name: uptime

on:
  schedule:
    # Every 10 minutes. Frequent enough that an outage is noticed in single
    # digit minutes, infrequent enough not to look like traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: probe every public surface
        id: probe
        run: |
          chmod +x deploy/verify/smoke.sh
          set +e
          OUTPUT=$(deploy/verify/smoke.sh \
            "${{ secrets.CONTROL_HOST }}" \
            "${{ secrets.CELL_1_HOST }}" \
            "${{ secrets.CELL_2_HOST }}" 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          {
            echo "output<<PROBE_EOF"
            echo "$OUTPUT"
            echo "PROBE_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $CODE

      - name: raise an alert
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '`uptime` probe failed at ' + new Date().toISOString() + '.',
              '',
              'Runbook: `docs/RUNBOOK.md`. Check the Recovery Console health map first,',
              'then the CloudWatch log group for whichever surface is failing.',
              '',
              '```',
              `${{ steps.probe.outputs.output }}`,
              '```',
              '',
              'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
            ].join('\n')

            // One open alert at a time. A flapping service should add comments
            // to the existing incident rather than bury the board in duplicates.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            })

            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.data[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Uptime probe failing',
                labels: ['uptime'],
                body,
              })
            }
